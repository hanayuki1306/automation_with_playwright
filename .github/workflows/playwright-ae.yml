name: Playwright AE Tests (Daily)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run AE tests
        env:
          AE_EMAIL: ${{ secrets.AE_EMAIL }}
          AE_PASSWORD: ${{ secrets.AE_PASSWORD }}
        run: npx playwright test tests/ae --project=chromium --reporter=html
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7


